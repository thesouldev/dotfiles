# ============================================
# Tmux Configuration
# ============================================

# ============================================
# General Settings
# ============================================

# Set true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback buffer size
set -g history-limit 50000

# Start window and pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Mouse mode OFF.
# Tradeoff: we give up wheel-scroll inside tmux panes and click-to-switch-pane,
# but get reliable native terminal selection (I-beam cursor, copy-on-release)
# in any terminal (iTerm2 on macOS, GNOME Terminal on Linux) without holding
# any modifier. This is the cleanest copy/paste experience when using TUIs
# like Claude Code inside a pane.
# Use <prefix> [ + arrows/PgUp/PgDn for keyboard scrolling.
# Use Alt+arrows or <prefix> h/j/k/l for switching panes.
set -g mouse off

# Reduce escape time for faster command sequences
set -sg escape-time 0

# Increase display time for messages
set -g display-time 4000

# Enable focus events
set -g focus-events on

# Enable aggressive resize
setw -g aggressive-resize on

# When the attached session is destroyed (last window killed, kill-session, etc.),
# switch to the next active session instead of detaching to the OS shell.
set -g detach-on-destroy off

# ============================================
# Key Bindings
# ============================================
# NOTE: Prefix key is Ctrl+a (changed from default Ctrl+b)
# When you see "Press: Ctrl+a then X", it means:
#   1. Press and hold Ctrl, tap 'a', release both
#   2. Then press the next key (X)

# Change prefix from Ctrl+b to Ctrl+a (more comfortable)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file
# Press: Ctrl+a then r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes (creates new pane in same directory)
# Press: Ctrl+a then \ (vertical split - side by side)
# Press: Ctrl+a then + (vertical split - side by side, alternative)
# Press: Ctrl+a then - (horizontal split - top and bottom)
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind + split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new window with current path
# Press: Ctrl+a then c (quick, uses default name)
bind c new-window -c "#{pane_current_path}"

# Create new window with name prompt
# Press: Ctrl+a then n
# Type window name and press Enter
bind n command-prompt -p "New window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# Rename current window
# Press: Ctrl+a then , (comma)
# Type new name and press Enter

# Rename current session
# Press: Ctrl+a then $ (dollar sign)
# Type new name and press Enter

# Session/window switcher: clean grey tree, sorted by most recent activity.
# Palette matches the status bar (no loud yellow).
# Press: Ctrl+a then s
bind s choose-tree -Zw -O time -F "#{?pane_format,#[fg=colour240]      └ #[fg=colour108]#{pane_current_command} #[fg=colour240]#{pane_current_path},#{?window_format,#[fg=colour240]   └ #[fg=colour252]#{window_index}: #[fg=colour255]#{window_name} #[fg=colour244](#{pane_current_command}#{?window_panes, #{window_panes}p,})#{?window_active, #[fg=colour108]●,},#[fg=colour255,bold]#{session_name} #[fg=colour244,nobold](#{session_windows} windows#{?session_attached, #[fg=colour108]• attached,})}}"

# Tone down the chooser's selection highlight (default is bright yellow).
# Used by choose-tree, copy-mode, etc.
set -g mode-style bg=colour237,fg=colour255

# Create new session with name prompt
# Press: Ctrl+a then Shift+N
# Type session name and press Enter (creates and switches to new session)
bind N command-prompt -p "New session name:" "new-session -s '%%'"

# Switch panes using Alt+Arrow keys (no prefix needed!)
# Press: Alt+Left Arrow (move to left pane)
# Press: Alt+Right Arrow (move to right pane)
# Press: Alt+Up Arrow (move to pane above)
# Press: Alt+Down Arrow (move to pane below)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes using vim keys (for vim users)
# Press: Ctrl+a then h (left)
# Press: Ctrl+a then j (down)
# Press: Ctrl+a then k (up)
# Press: Ctrl+a then l (right)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using vim keys (can repeat without prefix)
# Press: Ctrl+a then Shift+H (resize left)
# Press: Ctrl+a then Shift+J (resize down)
# Press: Ctrl+a then Shift+K (resize up)
# Press: Ctrl+a then Shift+L (resize right)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows easily (no prefix needed!)
# Press: Shift+Left Arrow (previous window)
# Press: Shift+Right Arrow (next window)
# Note: Ctrl+Left/Right is reserved by macOS for Spaces, so we use Shift+arrows
bind -n S-Left previous-window
bind -n S-Right next-window

# Window switching with prefix (use this if above conflicts with macOS)
# Press: Ctrl+a then Ctrl+Left Arrow (previous window)
# Press: Ctrl+a then Ctrl+Right Arrow (next window)
bind -r C-Left select-window -t :-
bind -r C-Right select-window -t :+

# Window switching with vim keys (alternative)
# Press: Ctrl+a then Ctrl+h (previous window)
# Press: Ctrl+a then Ctrl+l (next window)
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Kill pane/window/session without confirmation
# Press: Ctrl+a then x (kill current pane)
# Press: Ctrl+a then Shift+X (kill current window)
# Press: Ctrl+a then Shift+Q (kill current session - auto switches to another if exists)
bind x kill-pane
bind X kill-window
bind Q kill-session

# Toggle synchronize-panes (send same command to all panes)
# Press: Ctrl+a then Shift+S
bind S set-window-option synchronize-panes\; display "Synchronize panes: #{?pane_synchronized,ON,OFF}"

# ============================================
# Copy Mode (cross-platform: macOS + Linux)
# ============================================
#
# Mouse drag-to-copy inside tmux is REMOVED. It interferes with TUIs like
# Claude Code and is unreliable. Two reliable paths instead:
#
# 1. Mouse (terminal-native, bypasses tmux capture):
#      macOS / iTerm2:        Hold Option, then drag
#      Linux / GNOME Terminal: Hold Shift, then drag
#    Then copy with Cmd+C (Mac) or Ctrl+Shift+C (Linux).
#    Tip: iTerm2 has "Copy to pasteboard on selection" in
#         Settings > General > Selection — enable it for one-step copy.
#    GNOME Terminal: Edit > Preferences > "Copy selected text to clipboard".
#
# 2. Keyboard (vi copy mode — works the same on both OSes):
#      Ctrl+a [   enter copy mode
#      v          start selecting
#      V          select whole line
#      Ctrl+v     toggle rectangular selection
#      h j k l    move (or arrows, Page Up/Down)
#      /  ?       search forward / backward
#      y / Enter  copy to system clipboard and exit
#      q          quit without copying

# Use vi keys in copy mode
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode
bind Escape copy-mode

# Selection bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Pick the right clipboard command at config-load time.
# macOS:    pbcopy
# Linux X11: xclip -selection clipboard -in
# Linux Wayland: wl-copy
# The chain below falls back gracefully if some are not installed.
if-shell -b 'test "$(uname)" = "Darwin"' {
  bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
} {
  bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "sh -c 'xclip -selection clipboard -in 2>/dev/null || wl-copy 2>/dev/null'"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "sh -c 'xclip -selection clipboard -in 2>/dev/null || wl-copy 2>/dev/null'"
}

# Paste
bind p paste-buffer
bind P choose-buffer

# ============================================
# Status Bar Customization
# ============================================

# Update status bar every second
set -g status-interval 1

# Position status bar at top
set -g status-position bottom

# Status bar colors
set -g status-style bg=colour234,fg=colour137

# Left side of status bar
set -g status-left-length 30
set -g status-left '#[fg=colour233,bg=colour245,bold] #S #[fg=colour245,bg=colour234,nobold] '

# Right side of status bar (shows date in DD-MM-YYYY and time in 12-hour format)
set -g status-right-length 60
set -g status-right '#[fg=colour233,bg=colour241,bold] %d-%m-%Y #[fg=colour233,bg=colour245,bold] %I:%M:%S %p '

# Window status format
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Message style
set -g message-style bg=colour235,fg=colour166

